[package]
name = "doris"
version = "0.1.0"
edition = "2021"
description = "A terminal torrent client: search trackers, play or download, watch it live"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "rustls-tls"] }
scraper = "0.21"
axum = "0.7"
encoding_rs = "0.8"
anyhow = "1"
dirs = "5"
url = "2"
urlencoding = "2"
chrono = "0.4"
which = "6"
serde_json = "1"
fantoccini = "0.22.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
hostname = "0.4"
whoami = "1"
getrandom = "0.2"
base64 = "0.22"
serial_test = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
unicode-width = "0.2"
# Needed for src/sources/rutor.rs: extracting size/seeds/peers/date from a
# table row's HTML is far more robust as a couple of small, well-anchored
# patterns than nested DOM traversal guesses against a page whose exact
# CSS classes weren't directly inspectable while writing this.
regex = "1"
# Needed so `Source` (src/sources/source.rs) can be used as `Box<dyn Source>`
# in a registry: native async-fn-in-traits (stable since Rust 1.75) is not
# object-safe on its own, this crate boxes the futures so it is. Small,
# widely-used, proc-macro only (no extra runtime dependencies pulled in).
async-trait = "0.1"

# 71 integration-test binaries, each linked from scratch after a change to
# anything shared (`src/lib.rs` alone invalidates every one of them). Debug
# info is most of what those objects carry and none of what a test reads:
# a panic prints a file and a line, and that is the whole use of it here.
[profile.dev]
debug = 0
