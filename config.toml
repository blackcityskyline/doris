# Doris Configuration
# Place this file at ~/.config/doris/config.toml

# Browser to use (chrome, chromium, brave, helium) - auto-detect if empty
browser = ""

# Browser window visibility: "visible" or "hidden" (default: hidden)
browser_visibility = "hidden"

# TorrServer URL
torrserver_url = "http://127.0.0.1:8090"

# Extension Bridge port (set 0 to disable)
bridge_port = 14141

# Cookie file path. Leave it out to get ~/.config/doris/cookies.txt.
# A relative path is resolved against this file's directory and rewritten
# absolute on the next load, so it stays the same file whichever directory
# doris is started from.
# cookie_file = "/home/you/.config/doris/cookies.txt"

# --- Welcome animation -------------------------------------------------
# Played on stdout before the UI takes the terminal. Never in --cli mode,
# never when stdout is not a terminal, and never with false_tty = true.

# welcome_enabled = true
# Built-in name, or the stem of a .anim file in ~/.config/doris/welcome/.
# welcome_template = "doris"
# Milliseconds between frames: the speed.
# welcome_frame_ms = 90
# Total milliseconds to play for. 0 plays the animation once through.
# welcome_duration_ms = 1600
# The greeting, put wherever the template wrote {text}.
# welcome_text = "Welcome to Doris"
